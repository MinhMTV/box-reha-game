plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.boxreha.dynamics'
    compileSdk 36

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'com.riseworld.dynamics.multiplatform:dynamics-multiplatform:0.25.6'
    implementation 'com.russhwolf:multiplatform-settings:1.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    // Unity supplies this at export time. Standalone validation supplies the same JAR explicitly.
    if (providers.gradleProperty('unityClassesJar').isPresent()) {
        compileOnly files(providers.gradleProperty('unityClassesJar').get())
    } else {
        compileOnly files('../libs/unity-classes.jar')
    }
}

// Explicit local compatibility mode. Original vendor metadata is never modified.
def dynamicsMode = providers.gradleProperty('dynamicsSdkMode').orElse(providers.environmentVariable('DYNAMICS_SDK_MODE')).getOrElse('VENDOR-UNCHANGED')
if (!(dynamicsMode in ['VENDOR-UNCHANGED', 'COMPATIBILITY'])) throw new GradleException('Unknown dynamicsSdkMode: ' + dynamicsMode)
if (dynamicsMode == 'COMPATIBILITY') {
    configurations.configureEach {
        resolutionStrategy.eachDependency { d ->
            if (d.requested.group == 'com.riseworld.launchpad.resource' && d.requested.name in ['resource', 'resource-android'] && d.requested.version == '2.11.1') {
                d.useVersion('2.12.0')
                d.because('Audited local compatibility for SDK 0.25.6; missing vendor resource 2.11.1')
            }
        }
    }
}
logger.lifecycle('Dynamics SDK mode: ' + dynamicsMode)

android { buildFeatures { buildConfig true }; defaultConfig { buildConfigField "String", "SDK_BUILD_MODE", "\"${dynamicsMode}\"" } }

// Pin the exact Android ABI this source adapter was tested against, including the replacement dependency.
tasks.register('verifyDynamicsAbiInputs') {
    doLast {
        def pins = [
          'dynamics-models-android':'05f95b816ed3490b836588a5719d1b2dc8e45fb7c93301b9357cb967fb936da0',
          'dynamics-models-composite-android':'3207bc50915057022353ceaaefe81093590b38dfd178c2348847506f1ff9f3e4',
          'ble-multiplex-models-android':'94b6789918b0a4b7e239e7112b5465c06d67989c0bb698075bed0a3519c60198',
          'resource-android':'92a35aaccd31d8f1018fe72813478b0e1db4f1a4f52b29e49c9ddf9c0dd6ec4e']
        def found = [] as Set
        configurations.debugRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.each { a ->
            if (pins.containsKey(a.name)) {
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(a.file.bytes).encodeHex().toString()
                if (digest != pins[a.name]) throw new GradleException('Dynamics compatibility ABI hash mismatch: ' + a.name)
                found.add(a.name)
            }
        }
        if (found != pins.keySet()) throw new GradleException('Incomplete Dynamics ABI input set: ' + found)
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyDynamicsAbiInputs' }
