pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def sdkRepo = providers.gradleProperty('dynamicsMavenPath').orElse(providers.environmentVariable('DYNAMICS_MAVEN_PATH'))
        if (!sdkRepo.isPresent()) throw new GradleException('Set DYNAMICS_MAVEN_PATH or -PdynamicsMavenPath to the supplied SDK mavenLocal directory.')
        maven {
            url = uri(sdkRepo.get())
            content { includeGroupByRegex 'com\\.riseworld.*'; includeGroupByRegex 'com\\.launchpad.*' }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = 'dynamics-android-qualification'
include ':bridge'
project(':bridge').projectDir = file('../../Assets/Plugins/Android/DynamicsSdkUnityBridge.androidlib')
